name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      publish_tag: ${{ steps.metadata.outputs.publish_tag }}
    steps:
      - name: Extract version and metadata
        id: metadata
        shell: bash
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 Pull Request detected - running in DRY RUN mode"
            COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="pr-${{ github.event.pull_request.number }}-${COMMIT_SHA}"
            IS_PRERELEASE="true"
            RELEASE_NAME="PR #${{ github.event.pull_request.number }} Test Build"
            TAG_NAME="pr-${{ github.event.pull_request.number }}"
            # No publish channel - PRs never trigger the registry publisher.
            CHANNEL=""
            PUBLISH_TAG=""
          elif echo "${{ github.ref }}" | grep -q "^refs/tags/v"; then
            VERSION=$(echo "${{ github.ref }}" | sed 's|refs/tags/v||')
            IS_PRERELEASE="false"
            RELEASE_NAME="v${VERSION}"
            TAG_NAME="v${VERSION}"
            CHANNEL="stable"
            PUBLISH_TAG="v${VERSION}"
          else
            # Rolling development pre-release from the main branch.
            BUILD_TS="${{ github.event.head_commit.timestamp }}"
            if [ -n "$BUILD_TS" ]; then
              VERSION=$(date -u -d "$BUILD_TS" +'%Y.%m.%d.%H%M%S')
            else
              VERSION=$(date -u +'%Y.%m.%d.%H%M%S')
            fi
            IS_PRERELEASE="true"
            RELEASE_NAME="Latest Development Build"
            TAG_NAME="latest"
            # Development builds remain GitHub-only.
            CHANNEL=""
            PUBLISH_TAG=""
          fi

          {
            echo "version=$VERSION"
            echo "commit_sha=${{ github.sha }}"
            echo "build_date=$BUILD_DATE"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "release_name=$RELEASE_NAME"
            echo "tag_name=$TAG_NAME"
            echo "channel=$CHANNEL"
            echo "publish_tag=$PUBLISH_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Commit: ${{ github.sha }}"
          echo "Build Date: $BUILD_DATE"
          echo "Is Prerelease: $IS_PRERELEASE"
          echo "Release Name: $RELEASE_NAME"
          echo "Tag Name: $TAG_NAME"
          echo "Channel: $CHANNEL"
          echo "Publish Tag: $PUBLISH_TAG"

  build-cli-binaries:
    name: Build CLI Binaries
    needs: prepare
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      build_date: ${{ needs.prepare.outputs.build_date }}
    secrets: inherit

  release:
    name: Create Release
    needs: [prepare, build-cli-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum apple-docs-* > checksums.txt
          cat checksums.txt

      - name: Prepare release notes
        run: |
          if [ "${{ needs.prepare.outputs.is_prerelease }}" = "true" ]; then
            TEMPLATE=".github/pre-release-template.md"
          else
            TEMPLATE=".github/release-template.md"
          fi

          sed -e 's/{{VERSION}}/${{ needs.prepare.outputs.version }}/g' \
              -e 's/{{COMMIT_SHA}}/${{ needs.prepare.outputs.commit_sha }}/g' \
              -e 's/{{BUILD_DATE}}/${{ needs.prepare.outputs.build_date }}/g' \
              -e 's|{{REPOSITORY}}|${{ github.repository }}|g' \
              "$TEMPLATE" > dist/release-notes.md
          cat dist/release-notes.md

      - name: Delete existing latest release (pre-release only)
        if: needs.prepare.outputs.is_prerelease == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          body_path: dist/release-notes.md
          files: |
            dist/apple-docs-darwin-amd64
            dist/apple-docs-darwin-arm64
            dist/checksums.txt
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}

  trigger-publisher:
    name: Trigger Release Publisher
    needs: [prepare, release]
    # Dispatch the techprimate/publisher workflow that publishes this GitHub
    # Release through packages.kula.app. Replaces the in-repo Homebrew tap
    # automation. Skipped for PR and rolling development builds (no channel).
    if: needs.prepare.outputs.channel != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.KULA_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KULA_RELEASE_BOT_PRIVATE_KEY }}
          repositories: publisher
          owner: techprimate

      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run publish.yml \
            --repo techprimate/publisher \
            --ref main \
            -f source_repo="${{ github.repository }}" \
            -f tag="${{ needs.prepare.outputs.publish_tag }}" \
            -f channel="${{ needs.prepare.outputs.channel }}"

  release-required-check:
    name: Release - Required Check
    needs:
      - prepare
      - build-cli-binaries
      - release
      - trigger-publisher
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the release jobs has failed." && exit 1
