name: Build Binaries

on:
  workflow_call:
    inputs:
      version:
        description: "Version string to embed"
        required: true
        type: string
      commit_sha:
        description: "Commit SHA to embed"
        required: true
        type: string
      build_date:
        description: "Build date to embed"
        required: true
        type: string
    secrets:
      DEVELOPER_ID_P12_BASE64:
        description: "Base64-encoded Developer ID Application certificate (.p12), including chain"
        required: false
      DEVELOPER_ID_PASSWORD:
        description: "Password for the Developer ID certificate"
        required: false
      APPLE_NOTARIZATION_APP_STORE_CONNECT_API_KEY_P8_BASE64:
        description: "Base64-encoded App Store Connect API key (.p8 PEM file) used for notarization"
        required: false
      SENTRY_AUTH_TOKEN:
        description: "Organization token used to upload Sentry debug symbols"
        required: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            architecture: arm64
          - platform: darwin-amd64
            architecture: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Generate build metadata
        uses: ./.github/actions/generate-build-metadata
        with:
          version: ${{ inputs.version }}
          commit-sha: ${{ inputs.commit_sha }}
          build-date: ${{ inputs.build_date }}

      - name: Build CLI
        id: build
        run: |
          swift build -c release --arch "${{ matrix.architecture }}"
          BIN_DIR=$(swift build -c release --arch "${{ matrix.architecture }}" --show-bin-path)
          test -d "$BIN_DIR/apple-docs.dSYM"
          mkdir -p dist
          cp "$BIN_DIR/apple-docs" "dist/apple-docs-${{ matrix.platform }}"
          echo "bin_dir=$BIN_DIR" >> "$GITHUB_OUTPUT"

      - name: Install sentry-cli
        if: github.event_name != 'pull_request'
        env:
          SENTRY_CLI_VERSION: "3.7.0"
          SENTRY_CLI_SHA256: "10ccaaa39e6eee2b52034546f5f617533fdc76c64aa75c3038887045da1a367d"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-universal" \
            --output "$RUNNER_TEMP/sentry-cli"
          echo "$SENTRY_CLI_SHA256  $RUNNER_TEMP/sentry-cli" | shasum -a 256 --check
          chmod +x "$RUNNER_TEMP/sentry-cli"

      - name: Upload dSYM to Sentry
        if: github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: techprimate
          SENTRY_PROJECT: apple-docs-cli
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not configured."
            exit 1
          fi

          DSYM_PATH="${{ steps.build.outputs.bin_dir }}/apple-docs.dSYM"
          "$RUNNER_TEMP/sentry-cli" debug-files check \
            "$DSYM_PATH/Contents/Resources/DWARF/apple-docs"
          "$RUNNER_TEMP/sentry-cli" debug-files upload \
            --include-sources \
            --wait \
            "$DSYM_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: dist/apple-docs-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            swift_sdk: x86_64-swift-linux-musl
          - platform: linux-arm64
            swift_sdk: aarch64-swift-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Install Static Linux SDK
        run: |
          swift sdk install \
            "https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum "87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b"

      - name: Generate build metadata
        uses: ./.github/actions/generate-build-metadata
        with:
          version: ${{ inputs.version }}
          commit-sha: ${{ inputs.commit_sha }}
          build-date: ${{ inputs.build_date }}

      - name: Build CLI with debug information
        id: build-linux
        run: |
          swift build -c release --swift-sdk "${{ matrix.swift_sdk }}"
          BIN_DIR=$(swift build -c release --swift-sdk "${{ matrix.swift_sdk }}" --show-bin-path)
          BUILD_ID=$(readelf --notes "$BIN_DIR/apple-docs" | awk '/Build ID/ { print $3 }')
          test -n "$BUILD_ID"
          echo "bin_dir=$BIN_DIR" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Install sentry-cli
        if: github.event_name != 'pull_request'
        env:
          SENTRY_CLI_VERSION: "3.7.0"
          SENTRY_CLI_SHA256: "cec71d46a7cc394c94b6e75f1601985c710d457376c546ef3975567b3671563b"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64" \
            --output "$RUNNER_TEMP/sentry-cli"
          echo "$SENTRY_CLI_SHA256  $RUNNER_TEMP/sentry-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/sentry-cli"

      - name: Upload Linux debug information to Sentry
        if: github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: techprimate
          SENTRY_PROJECT: apple-docs-cli
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not configured."
            exit 1
          fi

          BINARY_PATH="${{ steps.build-linux.outputs.bin_dir }}/apple-docs"
          "$RUNNER_TEMP/sentry-cli" debug-files check "$BINARY_PATH"
          "$RUNNER_TEMP/sentry-cli" debug-files upload \
            --include-sources \
            --wait \
            "$BINARY_PATH"

      - name: Build stripped CLI
        run: |
          swift build -c release \
            --swift-sdk "${{ matrix.swift_sdk }}" \
            -Xlinker --strip-all
          BIN_DIR=$(swift build \
            -c release \
            --swift-sdk "${{ matrix.swift_sdk }}" \
            --show-bin-path)
          mkdir -p dist
          cp "$BIN_DIR/apple-docs" "dist/apple-docs-${{ matrix.platform }}"

      - name: Verify Linux artifact size
        run: |
          BINARY_PATH="dist/apple-docs-${{ matrix.platform }}"
          BINARY_SIZE=$(stat --format=%s "$BINARY_PATH")
          BUILD_ID=$(readelf --notes "$BINARY_PATH" | awk '/Build ID/ { print $3 }')
          echo "Linux artifact size: $BINARY_SIZE bytes"
          test "$BINARY_SIZE" -lt 80000000
          test "$BUILD_ID" = "${{ steps.build-linux.outputs.build_id }}"
          if readelf --sections "$BINARY_PATH" | grep --quiet '\.debug_'; then
            echo "::error::Linux artifact contains debug sections."
            exit 1
          fi

      - name: Exercise Linux CLI
        if: matrix.platform == 'linux-amd64'
        run: |
          "dist/apple-docs-${{ matrix.platform }}" \
            types view String --technology Swift --json \
            > "$RUNNER_TEMP/string.json"
          jq -e '.metadata.title == "String"' "$RUNNER_TEMP/string.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: dist/apple-docs-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  sign-and-notarize-darwin:
    name: Sign and Notarize macOS Binaries
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kula/rcodesign:alpine
    steps:
      - name: Download macOS CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cli-darwin-*
          merge-multiple: true

      - name: Write signing material
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARIZATION_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ vars.APPLE_NOTARIZATION_APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APPLE_NOTARIZATION_APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -eu
          umask 077
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -d > cert.p12
          printf '%s' "$DEVELOPER_ID_PASSWORD" > cert.pw
          printf '%s' "$API_KEY_P8_BASE64" | base64 -d > api_key.p8
          rcodesign encode-app-store-connect-api-key \
            -o api_key.json \
            "$API_ISSUER_ID" "$API_KEY_ID" api_key.p8
          rm api_key.p8

      - name: Sign and notarize CLI darwin-arm64
        run: |
          set -eu
          cd dist

          rcodesign sign \
            --p12-file ../cert.p12 \
            --p12-password-file ../cert.pw \
            --code-signature-flags runtime \
            apple-docs-darwin-arm64

          rcodesign verify apple-docs-darwin-arm64

          zip -q apple-docs-darwin-arm64.zip apple-docs-darwin-arm64
          rcodesign notary-submit \
            --api-key-file ../api_key.json \
            --wait \
            apple-docs-darwin-arm64.zip
          rm apple-docs-darwin-arm64.zip

      - name: Sign and notarize CLI darwin-amd64
        run: |
          set -eu
          cd dist

          rcodesign sign \
            --p12-file ../cert.p12 \
            --p12-password-file ../cert.pw \
            --code-signature-flags runtime \
            apple-docs-darwin-amd64

          rcodesign verify apple-docs-darwin-amd64

          zip -q apple-docs-darwin-amd64.zip apple-docs-darwin-amd64
          rcodesign notary-submit \
            --api-key-file ../api_key.json \
            --wait \
            apple-docs-darwin-amd64.zip
          rm apple-docs-darwin-amd64.zip

      - name: Upload signed CLI darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          name: cli-darwin-arm64
          path: dist/apple-docs-darwin-arm64
          retention-days: 1
          overwrite: true

      - name: Upload signed CLI darwin-amd64
        uses: actions/upload-artifact@v7
        with:
          name: cli-darwin-amd64
          path: dist/apple-docs-darwin-amd64
          retention-days: 1
          overwrite: true

      - name: Cleanup signing material
        if: always()
        continue-on-error: true
        run: rm -f cert.p12 cert.pw api_key.p8 api_key.json
