name: Analyze

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3"

      - name: Install analysis tools
        run: brew bundle --file Brewfile-ci

      - name: Make Analyze
        run: make analyze
