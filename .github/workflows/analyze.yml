name: Analyze

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: Validate Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        uses: philprime/renovate-validator-action@d3f73f8f7bc7df0e9380239c30c2c55e44136cea # main

  analyze:
    name: Analyze
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.4.0"

      - name: Install analysis tools
        run: brew bundle --file Brewfile-ci

      - name: Make Analyze
        run: make analyze
